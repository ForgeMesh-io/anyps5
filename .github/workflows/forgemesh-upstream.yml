# Read-only report of how far this fork is from upstream. It does not push:
# updating `main` is done by a maintainer with `gh repo sync` (see FORGEMESH.md).
name: forgemesh-upstream

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Compare with upstream
        run: |
          {
            echo "## Upstream status"
            gh api "repos/${REPO}/compare/boykopovar:AnyPS5:main...main" \
              --jq '"- `main` vs upstream: \(.ahead_by) ahead, \(.behind_by) behind"'
            gh api "repos/${REPO}/compare/main...forgemesh" \
              --jq '"- `forgemesh` vs `main`: \(.ahead_by) ahead, \(.behind_by) behind"'
            gh api "repos/boykopovar/AnyPS5/pulls?state=open&per_page=1" -i \
              | grep -i '^link:' | sed -E 's/.*page=([0-9]+)>; rel="last".*/- open upstream PRs: ~\1/' || true
          } >> "$GITHUB_STEP_SUMMARY"
